<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>KRain Stake Report</title>
  <style>
    body { width: 340px; margin: 0; padding: 12px; font: 13px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #222; background: #fff; }
    h1 { margin: 0 0 8px; font-size: 15px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 4px 6px; border-bottom: 1px solid #eee; text-align: right; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    th { font-size: 11px; color: #777; font-weight: 600; }
    td { font-variant-numeric: tabular-nums; }
    .rain { color: #1e88c9; }
    .norain { color: #8a9a00; }
    .muted { color: #888; font-size: 11px; }
    .empty { padding: 16px 0; color: #777; }
    .day { margin-bottom: 4px; color: #e8711a; font-weight: 600; }
    .actions { display: flex; gap: 6px; margin-top: 10px; }
    button { flex: 1; padding: 6px; border: 0; border-radius: 4px; background: #e8711a; color: #fff; font-weight: 600; cursor: pointer; }
    button.secondary { background: #ddd; color: #333; }
  </style>
</head>
<body>
  <h1>KRain Stake Report</h1>
  <div id="out"></div>
  <div class="actions">
    <button id="reports">All reports</button>
    <button id="copy" class="secondary">Copy</button>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
